optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.00002,
  weight_decay : 0.0005
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 10,
  lr_decay: 0.8,
  lowest_decay: 0.1
}}

bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 10,
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}

model : {
    NAME: AdaPoinTr,
    num_basis: 8,
    num_query: 512,
    num_points: 16384,
    center_num: [512, 256],
    global_feature_dim: 1024,
    encoder_type: graph,
    decoder_type: fc,
    noise_type: 'point',
    denoise_length: 128,
    # Table 6 uses the complete Stage-I Prototype Auxiliary Branch checkpoint.
    prototype_config: {
      enabled: true,
      mode: full,
      num_query: 128,
      loss_weight: 0.10,
      target_space: xyz,
    },
    range_lm_config: {
      enabled: true,

      # Table 6: w/o Bounded Range Correction.
      # D_hat enters uncertainty-weighted DLM-CR directly; no correction head
      # is created or optimized, and the delta regularizer is disabled.
      correction_enabled: false,
      correction_scale: 0.0,
      delta_loss_weight: 0.0,

      # Retain the final XYZ objective and the exact full-model Stage-II LM protocol.
      xyz_loss_weight: 1.0,
      warmup_iterations: 5,
      gradient_iterations: 3,
      train_points: 4096,
      val_iterations: 80,
      damping: 0.001,
      min_distance: 0.000001,

      # Same freezing boundary and 50-epoch fine-tuning protocol as the full model.
      full_model_training: false,
      xyz_loss_warmup_epochs: 0,
      head_only_epochs: 0,

      # Retained in this ablation: uncertainty-derived per-range weighting.
      uncertainty_enabled: true,
      uncertainty_only: false,
      log_var_min: -4.0,
      log_var_max: 4.0,
      min_weight: 0.05,
      uncertainty_reg_weight: 0.0001,
    },
    encoder_config: {
      input_dim: 8,
      embed_dim: 384,
      depth: 6,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn'],
      combine_style: 'concat'
    },
    decoder_config: {
      embed_dim: 384,
      depth: 8,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      self_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      self_attn_combine_style: 'concat',
      cross_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      cross_attn_combine_style: 'concat',
    }
}

total_bs : 16
step_per_update : 1
max_epoch : 50

# Run the same fixed 50 epochs as the full Stage-II model.
early_stopping_patience : -1

# Validation selects val_best by recovered XYZ CD-L1.
consider_metric: CDL1
